# Legacy Render static site; moving to Cloudflare Pages (see DEPLOYMENT.md). Delete after cutover.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    # Must match the static site name in Render (drives the *.onrender.com hostname).
    name: sissy-foot-tarot
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
